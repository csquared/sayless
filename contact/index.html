        <title>SAYLESS</title>
        <style>
            @font-face {
                font-family: "Stencil Gothic";
                src: url("/assets/fonts/StencilGothic.ttf") format("truetype");
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: black;
                color: white;
                font-family: "Stencil Gothic", monospace;
                text-transform: uppercase;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 48px 24px;
            }

            .card {
                width: 100%;
                max-width: 420px;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            h1 {
                font-size: 3rem;
                letter-spacing: 8px;
                animation: flicker 2s infinite;
            }

            .tagline {
                font-size: 12px;
                letter-spacing: 4px;
                color: #666;
                margin-top: 8px;
            }

            .circuit-divider {
                width: 100%;
                margin: 32px 0;
            }

            .circuit-divider svg {
                display: block;
                width: 100%;
                height: auto;
            }

            .circuit-divider path,
            .circuit-divider circle {
                vector-effect: non-scaling-stroke;
            }

            @media (prefers-reduced-motion: reduce) {
                .circuit-divider .cd-pulse {
                    display: none;
                }
            }

            .social-icons {
                display: flex;
                justify-content: center;
                gap: 32px;
                margin: 24px 0 40px;
            }

            .social-icons a {
                color: #666;
                transition: color 0.2s;
            }

            .social-icons a:hover {
                color: white;
            }

            .social-icons .nav-icon {
                width: 28px;
                height: 28px;
                display: block;
            }

            .booking {
                font-size: 14px;
                letter-spacing: 2px;
                color: #999;
                margin-bottom: 12px;
            }

            .booking a {
                color: white;
                text-decoration: none;
                border-bottom: 1px solid #333;
                padding-bottom: 1px;
                transition: border-color 0.2s;
            }

            .booking a:hover {
                border-color: white;
            }

            .epk-link {
                font-size: 18px;
                letter-spacing: 6px;
                color: white;
                text-decoration: none;
                margin-top: 40px;
                padding: 4px 0;
                transition: color 0.2s;
            }

            .epk-link:hover {
                color: #ccc;
            }

            @keyframes flicker {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.8;
                }
            }

            @keyframes glitch-fill {
                0%,
                80%,
                100% {
                    fill: white;
                    transform: scale(1);
                }
                82% {
                    fill: #ff0000;
                    transform: scale(0.8) translateX(-2px);
                }
                85% {
                    fill: #00ff00;
                    transform: scale(1.2) translateY(2px);
                }
                88% {
                    fill: #0000ff;
                    transform: scale(0.9) translateX(2px);
                }
                92% {
                    fill: #ff00ff;
                    transform: scale(1.1) translateY(-2px);
                }
                95% {
                    fill: #ffff00;
                    transform: scale(1) translateX(-1px);
                }
            }

            @keyframes glitch-stroke-instagram {
                0%,
                80%,
                100% {
                    stroke-dasharray: none;
                    stroke: white;
                    opacity: 1;
                    filter: none;
                }
                82% {
                    stroke-dasharray: 15 5;
                    stroke: #ff0000;
                    opacity: 0.4;
                    filter: drop-shadow(0 0 8px black) blur(0.3px);
                }
                85% {
                    stroke-dasharray: 20 10;
                    stroke: #ff69b4;
                    opacity: 0.3;
                    filter: drop-shadow(0 0 10px black) contrast(150%);
                }
                88% {
                    stroke-dasharray: 5 15;
                    stroke: #0000ff;
                    opacity: 0.5;
                    filter: drop-shadow(0 0 12px black) brightness(0.4);
                }
                92% {
                    stroke-dasharray: 30 5;
                    stroke: #ff00ff;
                    opacity: 0.35;
                    filter: drop-shadow(0 0 15px black) saturate(0.5);
                }
                95% {
                    stroke-dasharray: 2 20;
                    stroke: #ffff00;
                    opacity: 0.4;
                    filter: drop-shadow(0 0 10px black) hue-rotate(180deg);
                }
            }

            @keyframes glitch-fill-instagram {
                0%,
                80%,
                100% {
                    fill: white;
                    transform: scale(1);
                    filter: none;
                }
                82% {
                    fill: #ff0000;
                    transform: scale(0.85) translateX(-2px) skewX(5deg);
                    filter: brightness(0.2) drop-shadow(0 0 10px black)
                        blur(0.5px);
                }
                85% {
                    fill: #ff69b4;
                    transform: scale(1.1) translateY(2px) rotate(-2deg);
                    filter: brightness(0.15) drop-shadow(0 0 15px black)
                        contrast(200%);
                }
                88% {
                    fill: #0000ff;
                    transform: scale(0.9) translateX(1px) skewY(-3deg);
                    filter: brightness(0.25) drop-shadow(0 0 12px black)
                        saturate(0.3);
                }
                92% {
                    fill: #ff00ff;
                    transform: scale(0.95) translateY(-1px) rotate(1deg);
                    filter: brightness(0.2) drop-shadow(0 0 18px black)
                        invert(0.1);
                }
                95% {
                    fill: #ffff00;
                    transform: scale(0.88) translateX(-1px) skewX(-2deg);
                    filter: brightness(0.3) drop-shadow(0 0 10px black)
                        sepia(0.5);
                }
            }
        </style>
    </head>
