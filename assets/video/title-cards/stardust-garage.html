<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            @font-face {
                font-family: "StencilGothic";
                src: url("../../../fonts/StencilGothic.ttf") format("truetype");
            }

            @font-face {
                font-family: "MoshraAesthetic";
                src:
                    url("../../../fonts/MoshraAesthetic-Regular.otf")
                        format("opentype"),
                    url("../../../fonts/MoshraAesthetic-Regular.ttf")
                        format("truetype");
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-image: url('../../images/purple-bg-square.png');
                background-size: cover;
                background-position: center;
            }

            .content {
                text-align: center;
                color: #fff;
            }

            .brand {
                font-family: "StencilGothic", sans-serif;
                font-size: 120px;
                letter-spacing: 15px;
                margin-bottom: 20px;
            }

            .event-title {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 15px;
                margin-bottom: 60px;
            }

            .ampersand {
                font-family: "StencilGothic", sans-serif;
                font-size: 48px;
                letter-spacing: 8px;
            }

            .friends {
                font-family: "Playfair Display", serif;
                font-style: italic;
                font-size: 72px;
                font-weight: 500;
                letter-spacing: 2px;
            }

            .venue-logo {
                width: 60px;
                height: 60px;
                border-radius: 8px;
                margin-top: 40px;
                margin-bottom: 12px;
            }

            .venue-name {
                font-family: "MoshraAesthetic", sans-serif;
                font-size: 72px;
                letter-spacing: 8px;
                margin-top: 0;
            }

            .venue-sub {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 20px;
                font-weight: 300;
                letter-spacing: 12px;
                margin-top: 4px;
                color: rgba(255, 255, 255, 0.7);
            }
        </style>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="content">
            <div class="brand">SAYLESS</div>
            <div class="event-title">
                <span class="ampersand">&amp;</span>
                <span class="friends">Kody Sun</span>
            </div>
            <img class="venue-logo" src="../../images/sdg-logo.jpg" alt="Stardust Garage" />
            <div class="venue-name">STARDUST</div>
            <div class="venue-sub">GARAGE</div>
        </div>
    </body>
</html>
