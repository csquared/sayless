<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="SAYLESS - contact" />
        <meta property="og:title" content="SAYLESS" />
        <meta property="og:url" content="https://justsayless.xyz/qr/" />
        <title>SAYLESS</title>
        <style>
            @font-face {
                font-family: "Stencil Gothic";
                src: url("/assets/fonts/StencilGothic.ttf") format("truetype");
            }

            * { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                background-color: black;
                color: white;
                font-family: "Stencil Gothic", monospace;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 32px 24px;
                text-transform: uppercase;
            }

            h1 {
                font-size: clamp(2.5rem, 12vw, 6rem);
                letter-spacing: 0.18em;
                animation: flicker 2s infinite;
                text-align: center;
            }

            .circuit-divider {
                width: min(88vw, 520px);
                margin: 20px 0 24px;
            }

            .circuit-divider svg {
                display: block;
                width: 100%;
                height: auto;
            }

            .circuit-divider path,
            .circuit-divider circle {
                vector-effect: non-scaling-stroke;
            }

            @media (prefers-reduced-motion: reduce) {
                .circuit-divider .cd-pulse { display: none; }
            }

            .qr {
                width: min(78vw, 420px);
                height: min(78vw, 420px);
                margin: 0 0 20px;
            }

            .qr svg {
                width: 100%;
                height: 100%;
                display: block;
            }

            .caption {
                font-size: 12px;
                letter-spacing: 4px;
                color: #666;
                text-align: center;
            }

            @keyframes flicker {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.8; }
            }
        </style>
    </head>

                    </g>
                    <use href="#cd-circuit" />
                </g>
                <g class="cd-pulse" mask="url(#cd-pulse-mask)" opacity="0.5">
